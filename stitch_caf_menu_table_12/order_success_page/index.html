<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Suivi de Commande — Stitch Café</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#FF5200",
            "background-light": "#FDFBF7",
            "background-dark": "#18181B",
            "surface-light": "#FFFBF5",
            "surface-dark": "#27272A",
            "success": "#65A30D",
          },
          fontFamily: {
            serif: ["'Playfair Display'", "serif"],
            sans: ["'Inter'", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem",
            "xl": "1.5rem",
            "2xl": "2rem",
          },
          boxShadow: {
            'gloss': '0 4px 12px -1px rgba(255, 82, 0, 0.35), 0 2px 4px -1px rgba(255, 82, 0, 0.15)',
            'soft': '0 20px 40px -10px rgba(0, 0, 0, 0.08)',
          }
        },
      },
    };
  </script>
  <style>
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-panel {
      background: rgba(39, 39, 42, 0.88);
    }
    body {
      min-height: 100dvh;
    }
    /* Strict icon centering inside step circles */
    .step-circle {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .step-circle .material-symbols-outlined {
      font-size: 20px;
      line-height: 1;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }
    .step-circle.is-inactive {
      background-color: #E5E7EB;
      color: #9CA3AF;
      box-shadow: 0 0 0 3px #FDFBF7;
    }
    .dark .step-circle.is-inactive {
      background-color: #27272A;
      color: #71717A;
      box-shadow: 0 0 0 3px #18181B;
    }
    .step-circle.is-active {
      background-color: #FF5200;
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(255, 82, 0, 0.35), 0 0 0 3px #FDFBF7;
    }
    .dark .step-circle.is-active {
      box-shadow: 0 6px 16px rgba(255, 82, 0, 0.4), 0 0 0 3px #18181B;
    }
    .step-circle.is-current {
      transform: scale(1.1);
    }
    .step-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
      transition: color 0.3s ease;
    }
    .step-label.is-inactive {
      color: #9CA3AF;
    }
    .dark .step-label.is-inactive {
      color: #71717A;
    }
    .step-label.is-active {
      color: #FF5200;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-between font-sans transition-colors duration-300 relative overflow-x-hidden pt-6 pb-20">
  <main class="flex-1 w-full max-w-[390px] px-5 flex flex-col items-center justify-center relative z-10">
    <!-- Hero Image -->
    <div class="relative w-full flex items-center justify-center mb-6">
      <div class="absolute inset-0 bg-orange-100/60 dark:bg-orange-900/20 rounded-full blur-3xl transform scale-75"></div>
      <img
        id="order-hero-img"
        alt="Votre commande"
        class="w-44 h-44 object-cover rounded-full shadow-soft z-10 ring-4 ring-white/80 dark:ring-white/10"
        src="../images/sub catégorie images/Brunch food/croissant-benedict-salmon-with-poched-egg-hollandaise-sauce-served-with-fresh-salad_140725-1329.avif"
        onerror="this.onerror=null;this.src='../images/catégorie images/Brunch.jpg';"
      />
      <div class="absolute top-4 right-16 w-2.5 h-2.5 bg-green-500/80 rounded-full blur-[0.5px] animate-pulse"></div>
      <div class="absolute bottom-6 left-16 w-3 h-3 bg-orange-500/80 rounded-full blur-[0.5px] animate-bounce" style="animation-duration: 3s;"></div>
    </div>

    <!-- Status Heading & Subtitle -->
    <div class="text-center space-y-2 mb-8">
      <h1 id="order-status-heading" class="font-serif text-[26px] font-bold text-gray-900 dark:text-white tracking-tight drop-shadow-sm leading-tight">
        Aucune commande active
      </h1>
      <p id="order-status-subtext" class="text-gray-500 dark:text-gray-400 text-[13.5px] font-medium leading-normal px-2">
        Ajoutez un article depuis le menu pour suivre votre commande en direct.
      </p>
    </div>

    <!-- 4-Step Progress Tracker -->
    <div class="w-full px-1 mb-6 relative">
      <div class="w-full relative">
        <!-- Background Track Line (Grey) -->
        <div class="absolute top-[22px] left-[12.5%] right-[12.5%] h-[3px] bg-gray-200 dark:bg-zinc-800 rounded-full -z-10"></div>
        <!-- Active Progress Line (Orange) -->
        <div id="order-progress-fill" class="absolute top-[22px] left-[12.5%] w-0 h-[3px] bg-primary rounded-full -z-10 transition-all duration-500"></div>

        <!-- 4 Steps (All start in uniform grey when inactive) -->
        <div id="order-steps-container" class="flex justify-between items-start w-full">
          <!-- Step 1: Placed / Reçue -->
          <div class="step-item flex flex-col items-center gap-2 w-1/4" data-step="0">
            <div class="step-circle is-inactive">
              <span class="material-symbols-outlined">check</span>
            </div>
            <span class="step-label is-inactive">Placed</span>
          </div>

          <!-- Step 2: Preparing / En cuisine -->
          <div class="step-item flex flex-col items-center gap-2 w-1/4" data-step="1">
            <div class="step-circle is-inactive">
              <span class="material-symbols-outlined">skillet</span>
            </div>
            <span class="step-label is-inactive">Preparing</span>
          </div>

          <!-- Step 3: On Route / Serveur (Waiter cloche icon instead of truck) -->
          <div class="step-item flex flex-col items-center gap-2 w-1/4" data-step="2">
            <div class="step-circle is-inactive">
              <span class="material-symbols-outlined">room_service</span>
            </div>
            <span class="step-label is-inactive">On Route</span>
          </div>

          <!-- Step 4: Served / À table -->
          <div class="step-item flex flex-col items-center gap-2 w-1/4" data-step="3">
            <div class="step-circle is-inactive">
              <span class="material-symbols-outlined">restaurant</span>
            </div>
            <span class="step-label is-inactive">Served</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Action Card -->
  <div class="w-full max-w-[390px] px-4 z-20">
    <div class="glass-panel p-[14px] rounded-[16px] shadow-sm border border-gray-200/60 dark:border-white/10 space-y-3">
      <button id="return-btn" class="w-full h-[48px] bg-primary text-white rounded-[12px] font-bold text-base shadow-gloss hover:opacity-95 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
        <span>Retour au Menu</span>
        <span class="material-symbols-outlined text-xl">restaurant_menu</span>
      </button>
      <button id="view-details-btn" class="w-full text-center pb-1">
        <span class="text-gray-500 dark:text-gray-400 font-semibold text-xs hover:text-primary dark:hover:text-primary transition-colors">
          Voir les détails de la commande
        </span>
      </button>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div id="order-details-modal" class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-[360px] rounded-2xl p-5 shadow-2xl border border-gray-100 dark:border-zinc-800">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100 dark:border-zinc-800">
        <div>
          <h3 id="modal-order-title" class="font-bold text-base text-gray-900 dark:text-white">Détails de la commande</h3>
          <p id="modal-order-meta" class="text-xs text-gray-500 dark:text-gray-400">Table 12</p>
        </div>
        <button id="close-details-modal" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-zinc-800 flex items-center justify-center text-gray-500 hover:text-gray-800 dark:hover:text-white">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>
      <div id="modal-order-items" class="space-y-2.5 max-h-[240px] overflow-y-auto pr-1 text-sm"></div>
      <div class="mt-4 pt-3 border-t border-gray-100 dark:border-zinc-800 flex items-center justify-between font-bold text-base text-gray-900 dark:text-white">
        <span>Total</span>
        <span id="modal-order-total" class="text-primary">0.00 DH</span>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav class="standard-nav-bar bg-white dark:bg-[#2a1e19] border-t border-gray-100 dark:border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] backdrop-blur-md h-[55px] flex items-stretch justify-between px-6 fixed bottom-0 left-0 right-0 z-50 max-w-[390px] mx-auto">
    <button onclick="window.location.href='../swiggy-style_elite_main_menu_390x2500/index.html'" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[22px]">home</span>
      <span class="text-[10px] font-bold uppercase tracking-widest">Home</span>
    </button>
    <button onclick="window.location.href='../swiggy-style_elite_main_menu_390x2500/index.html#explore'" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[22px]">category</span>
      <span class="text-[10px] font-bold uppercase tracking-widest">Explore</span>
    </button>
    <button onclick="window.location.href='../order_success_page/index.html'" class="relative flex-1 flex flex-col items-center justify-center gap-0.5 text-primary transition-colors">
      <span class="material-symbols-outlined text-[22px]">shopping_cart</span>
      <span class="text-[10px] font-bold uppercase tracking-widest">Suivi</span>
      <span id="global-cart-count" class="absolute -top-1 right-4 bg-primary text-white text-[10px] font-bold px-1.5 py-[2px] rounded-full hidden">0</span>
    </button>
    <button onclick="window.location.href='../swiggy-style_elite_main_menu_390x2500/index.html'" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-600 dark:text-gray-300 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[22px]">restaurant_menu</span>
      <span class="text-[10px] font-bold uppercase tracking-widest">Menu</span>
    </button>
  </nav>

  <script src="../stitch-cloud-sync.js?v=20261113_v1"></script>
  <script src="script.js?v=10"></script>
  <script src="../nav-bar.js?v=10"></script>
  <script src="../theme-engine.js?v=1"></script>
</body>
</html>
